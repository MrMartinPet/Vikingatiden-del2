<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>Pelles Rockabilly Radar</title>

<style>
:root{
  --bg:#050505;
  --card:#151515;
  --line:#303030;
  --text:#f4f4f4;
  --muted:#b8b8b8;
  --orange:#ff9900;
  --blue:#39a8ff;
  --green:#1db954;
  --yellow:#ffd15c;
  --radius:18px;
}

*{box-sizing:border-box}

html{scroll-behavior:smooth}

body{
  margin:0;
  background:radial-gradient(circle at top,#292929 0,#090909 42%,#050505 100%);
  color:var(--text);
  font-family:Arial,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  padding-bottom:86px;
}

header{
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(5,5,5,.94);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
  padding:14px 14px 10px;
}

.top{
  max-width:980px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
}

.logo{
  width:50px;
  height:36px;
  border-radius:10px;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#123783,#fff 42%,#d82424 43%,#d82424 62%,#fff 63%);
  color:#ffcf40;
  font-size:11px;
  font-weight:950;
  text-shadow:0 1px 1px #000;
  transform:skew(-8deg);
  flex:0 0 auto;
}

h1{
  margin:0;
  font-size:18px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.small{
  color:var(--muted);
  font-size:12px;
  margin-top:2px;
}

.tabs,.filters{
  max-width:980px;
  margin:0 auto;
  display:flex;
  gap:8px;
  overflow:auto;
  scrollbar-width:none;
}

.tabs{
  padding-top:12px;
}

.tabs::-webkit-scrollbar,.filters::-webkit-scrollbar{
  display:none;
}

button,a{
  -webkit-tap-highlight-color:transparent;
}

.pill{
  border:1px solid var(--line);
  background:#161616;
  color:var(--text);
  border-radius:999px;
  padding:8px 11px;
  font-weight:850;
  cursor:pointer;
  white-space:nowrap;
  text-decoration:none;
}

.pill.active{
  background:var(--orange);
  border-color:var(--orange);
  color:#111;
}

main{
  max-width:980px;
  margin:auto;
  padding:14px;
}

.hero{
  background:linear-gradient(135deg,rgba(255,153,0,.22),rgba(57,168,255,.12)),var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:14px;
  box-shadow:0 10px 30px rgba(0,0,0,.35);
}

.hero h2{
  margin:0 0 6px;
  font-size:20px;
}

.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin:12px 0;
}

.stat{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:12px;
}

.stat b{
  display:block;
  font-size:22px;
}

.search{
  width:100%;
  margin:4px 0 12px;
  padding:13px 14px;
  border-radius:14px;
  border:1px solid var(--line);
  background:#101010;
  color:var(--text);
  font-size:16px;
  outline:none;
}

.filters{
  margin-bottom:12px;
}

.sectionTitle{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin:20px 0 10px;
}

.sectionTitle h2{
  margin:0;
  background:var(--orange);
  color:#fff;
  padding:8px 12px;
  border-radius:8px;
  font-size:23px;
}

.count{
  color:var(--muted);
  font-size:13px;
}

.event{
  background:linear-gradient(180deg,#181818,#101010);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:13px;
  margin:10px 0;
  display:grid;
  grid-template-columns:auto 1fr auto;
  gap:12px;
  align-items:start;
}

.time{
  min-width:54px;
  color:var(--orange);
  font-size:18px;
  font-weight:950;
}

.event.night .time{
  color:var(--blue);
}

.title{
  margin:0 0 5px;
  font-size:16px;
  font-weight:950;
}

.meta{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-bottom:8px;
  color:var(--muted);
  font-size:13px;
}

.tag{
  border:1px solid #333;
  border-radius:999px;
  background:#202020;
  padding:2px 7px;
}

.eventActions{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
}

.mini{
  border:1px solid #343434;
  border-radius:999px;
  background:#222;
  color:#fff;
  padding:7px 10px;
  font-size:13px;
  font-weight:950;
  text-decoration:none;
  cursor:pointer;
}

.mini.spotify{
  background:var(--green);
  color:#061b0d;
  border-color:var(--green);
}

.mini.searchSpotify{
  background:#293b30;
  color:#bfffd6;
  border-color:#356b45;
}

.star{
  width:42px;
  height:42px;
  border-radius:50%;
  border:1px solid #444;
  background:#111;
  color:#777;
  font-size:24px;
  cursor:pointer;
}

.star.on{
  background:var(--orange);
  border-color:var(--orange);
  color:#111;
}

.infoBox,.note{
  grid-column:2 / 4;
  display:none;
}

.infoBox.show{
  display:block;
  border-left:4px solid var(--orange);
  background:#1a1a1a;
  border-radius:12px;
  padding:10px;
  font-size:14px;
  color:#e8e8e8;
}

.event.selected .note{
  display:block;
}

textarea{
  width:100%;
  min-height:58px;
  resize:vertical;
  border-radius:12px;
  border:1px solid var(--line);
  background:#0b0b0b;
  color:var(--text);
  padding:10px;
  font-family:inherit;
}

.clash{
  background:var(--yellow);
  color:#111;
  border-radius:999px;
  padding:2px 8px;
  font-size:12px;
  font-weight:950;
}

.guide{
  display:none;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:14px;
  margin:12px 0;
}

.guide.show{
  display:block;
}

.guideItem{
  border-bottom:1px solid var(--line);
  padding:10px 0;
}

.guideItem:last-child{
  border-bottom:0;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:12px;
}

.action{
  border:0;
  border-radius:14px;
  background:var(--orange);
  color:#111;
  padding:12px;
  font-weight:950;
  cursor:pointer;
}

.action.secondary{
  background:#222;
  color:var(--text);
  border:1px solid var(--line);
}

.copybox{
  width:100%;
  min-height:160px;
  margin-top:10px;
  display:none;
}

.empty{
  color:var(--muted);
  text-align:center;
  padding:22px 10px;
  border:1px dashed #3a3a3a;
  border-radius:var(--radius);
}

.bottomnav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:30;
  background:rgba(5,5,5,.96);
  backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  padding:8px 10px calc(8px + env(safe-area-inset-bottom));
}

.bottomnav .wrap{
  max-width:980px;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
}

.navbtn{
  border:0;
  border-radius:14px;
  background:#151515;
  color:#fff;
  padding:9px 5px;
  font-size:12px;
  font-weight:950;
  cursor:pointer;
}

.navbtn.active{
  background:var(--orange);
  color:#111;
}

@media(max-width:520px){
  main{padding:12px}
  h1{font-size:16px}
  .event{grid-template-columns:auto 1fr auto;gap:10px;padding:12px}
  .sectionTitle h2{font-size:21px}
}
</style>
</head>

<header>
  <div class="top">
    <div class="brand">
      <div class="logo">AD</div>
      <div>
        <h1>Pelles Rockabilly Radar</h1>
        <div class="small">American Days Öland 4 till 6 juni</div>
      </div>
    </div>
    <button class="pill" id="showGuideBtn">Min guide</button>
  </div>
  <div class="tabs" id="dayTabs"></div>

  <section class="stats">
    <div class="stat">

  <input class="search" id="search" placeholder="Sök artist, plats eller dag">

  <div class="filters">
    <button class="pill active" data-filter="all">Alla</button>
    <button class="pill" data-filter="music">Musik</button>
    <button class="pill" data-filter="cars">Bilar</button>
    <button class="pill" data-filter="show">Show</button>
    <button class="pill" data-filter="night">American Nights</button>
    <button class="pill" data-filter="day">American Days</button>
  </div>

  <section class="guide" id="guide">
    <div class="sectionTitle">
      <h2>MIN GUIDE</h2>
      <span class="count" id="guideSummary"></span>
    </div>

    <div id="guideList"></div>

    <div class="actions">
      <button class="action" id="copyBtn">Skapa textguide</button>
      <button class="action secondary" id="clearBtn">Rensa val</button>
    </div>

    <textarea class="copybox" id="copyBox" readonly></textarea>
  </section>

  <div id="program"></div>
</main>

<nav class="bottomnav">
  <div class="wrap">
    <button class="navbtn active" data-jump="Torsdag">Torsdag</button>
    <button class="navbtn" data-jump="Fredag">Fredag</button>
    <button class="navbtn" data-jump="Lördag">Lördag</button>
    <button class="navbtn" id="guideNav">Guide</button>
  </div>
</nav>

      song:item.song,
      trackId:item.trackId,
      webUrl:webUrl,
      appUrl:"spotify:track:" + item.trackId,
      androidIntent:"intent://track/" + item.trackId + "#Intent;scheme=spotify;package=com.spotify.music;S.browser_fallback_url=" + encodeURIComponent(webUrl) + ";end",
      verified:true
    };
  }

  const searchUrl = "https://open.spotify.com/search/" + encodeURIComponent(name);

  return {
    song:"Sök på Spotify",
    trackId:null,
    webUrl:searchUrl,
    appUrl:null,
    androidIntent:null,
    verified:false
  };
}

function openSpotify(e){
  const spotify = spotifyData(e);

  if(!spotify.verified){
    window.open(spotify.webUrl,"_blank");
    return;
  }

  const isAndroid = /Android/i.test(navigator.userAgent);
  const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

  if(isAndroid && spotify.androidIntent){
    window.location.href = spotify.androidIntent;
    return;
  }

  if(isIOS && spotify.appUrl){
    window.location.href = spotify.appUrl;

    setTimeout(function(){
      window.location.href = spotify.webUrl;
    },900);

    return;
  }

  window.open(spotify.webUrl,"_blank");
}

function minutes(e){
  const parts = e.start.split(":").map(Number);
  let value = parts[0] * 60 + parts[1];

  if(e.nextDay){
    value += 24 * 60;
  }

  return value;
}

function typeText(type){
  return {music:"Musik",cars:"Bilar",show:"Show"}[type] || type;
}

function blockText(block){
  return block === "night" ? "American Nights" : "American Days";
}

function isSelected(id){
  return selected.includes(id);
}

function save(){
  localStorage.setItem("ad_selected",JSON.stringify(selected));
  localStorage.setItem("ad_notes",JSON.stringify(notes));
  localStorage.setItem("ad_day",activeDay);
}

function selectedEvents(){
  return events
    .filter(e=>isSelected(e.id))
    .sort((a,b)=>dayOrder(a.day) - dayOrder(b.day) || minutes(a) - minutes(b));
}

function clashIds(){
  const ids = new Set();
  const byDay = {};

  selectedEvents().forEach(e=>{
    byDay[e.day] ||= [];
    byDay[e.day].push(e);
  });

  Object.values(byDay).forEach(list=>{
    for(let i = 0; i < list.length; i++){
      for(let j = i + 1; j < list.length; j++){
        if(Math.abs(minutes(list[i]) - minutes(list[j])) < 30){
          ids.add(list[i].id);
          ids.add(list[j].id);
        }
      }
    }
  });

  return ids;
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g,m=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#039;"
  }[m]));
}

function renderTabs(){
  const days = ["Torsdag","Fredag","Lördag"];

  document.getElementById("dayTabs").innerHTML = days.map(d=>{
    return `<button class="pill ${d === activeDay ? "active" : ""}" data-day="${d}">${d}</button>`;
  }).join("");

  document.querySelectorAll("[data-day]").forEach(btn=>{
    btn.onclick = ()=>{
      activeDay = btn.dataset.day;
      save();
      render();
      document.getElementById("section-" + activeDay).scrollIntoView({behavior:"smooth",block:"start"});
    };
  });
}

function eventMatches(e){
  const q = search.value.trim().toLowerCase();
  const name = artistName(e);
  const info = artistInfo[name] || "";
  const spot = spotifyData(e).song || "";
  const text = `${e.day} ${e.start} ${e.title} ${e.place} ${typeText(e.type)} ${blockText(e.block)} ${info} ${spot}`.toLowerCase();
  const filterOk = activeFilter === "all" || e.type === activeFilter || e.block === activeFilter;

  return filterOk && (!q || text.includes(q));
}

function eventHtml(e,clash){
  const selectedClass = isSelected(e.id) ? "selected" : "";
  const starClass = isSelected(e.id) ? "on" : "";
  const name = artistName(e);
  const info = artistInfo[name] || "Ingen kortinfo inlagd ännu.";
  const spotify = spotifyData(e);

  let musicButtons = "";

  if(e.type === "music"){
    const spotifyClass = spotify.verified ? "spotify" : "searchSpotify";
    const spotifyText = spotify.verified ? "▶ Öppna i Spotify: " + spotify.song : "▶ Sök Spotify";

    musicButtons = `
      <div class="eventActions">
        <button class="mini ${spotifyClass}" data-spotify="${e.id}">${spotifyText}</button>
        <button class="mini" data-info="${e.id}">ℹ Info</button>
      </div>
    `;
  }

  const clashHtml = clash.has(e.id) ? `<span class="clash">Tidskrock</span>` : "";

  return `
    <article class="event ${e.block === "night" ? "night" : ""} ${selectedClass}">
      <div class="time">${e.start}</div>

      <div>
        <p class="title">${e.title}</p>
        <div class="meta">
          <span class="tag">${e.place}</span>
          <span class="tag">${typeText(e.type)}</span>
          <span class="tag">${blockText(e.block)}</span>
          ${clashHtml}
        </div>
        ${musicButtons}
      </div>

      <button class="star ${starClass}" data-star="${e.id}">★</button>

      <div class="infoBox" id="info-${e.id}">
        ${escapeHtml(info)}
      </div>

      <div class="note">
        <textarea data-note="${e.id}" placeholder="Egen notering, till exempel mötesplats eller måste ses">${notes[e.id] || ""}</textarea>
      </div>
    </article>
  `;
}

function renderProgram(){
  const clash = clashIds();
  const days = ["Torsdag","Fredag","Lördag"];

  program.innerHTML = days.map(day=>{
    const list = events
      .filter(e=>e.day === day && eventMatches(e))
      .sort((a,b)=>minutes(a) - minutes(b));

    return `
      <section id="section-${day}">
        <div class="sectionTitle">
          <h2>${day.toUpperCase()}</h2>
          <span class="count">${list.length} träffar</span>
        </div>
        ${list.length ? list.map(e=>eventHtml(e,clash)).join("") : `<div class="empty">Inga träffar med aktuellt filter.</div>`}
      </section>
    `;
  }).join("");

  bindEventButtons();
}

function bindEventButtons(){
  document.querySelectorAll("[data-star]").forEach(btn=>{
    btn.onclick = ()=>{
      const id = Number(btn.dataset.star);

      if(isSelected(id)){
        selected = selected.filter(x=>x !== id);
      }else{
        selected.push(id);
      }

      save();
      render();
    };
  });

  document.querySelectorAll("[data-info]").forEach(btn=>{
    btn.onclick = ()=>{
      document.getElementById("info-" + btn.dataset.info).classList.toggle("show");
    };
  });

  document.querySelectorAll("[data-spotify]").forEach(btn=>{
    btn.onclick = ()=>{
      const id = Number(btn.dataset.spotify);
      const event = events.find(x=>x.id === id);
      openSpotify(event);
    };
  });

  document.querySelectorAll("[data-note]").forEach(t=>{
    t.oninput = ()=>{
      notes[t.dataset.note] = t.value;
      save();
      renderGuide();
    };
  });
}

function renderGuide(){
  const list = selectedEvents();
  const clash = clashIds();

  document.getElementById("selectedCount").textContent = list.length;
  document.getElementById("clashCount").textContent = clash.size;
  document.getElementById("guideSummary").textContent = list.length ? `${list.length} valda` : "Tom guide";

  guideList.innerHTML = list.length ? list.map(e=>{
    const spotify = spotifyData(e);
    const spotifyLine = e.type === "music" ? `<div class="small"><button data-spotify="${e.id}" style="border:0;background:none;color:#1db954;font-weight:950;padding:0;font-size:12px;">${spotify.verified ? "Öppna i Spotify: " + spotify.song : "Sök på Spotify"}</button></div>` : "";

    return `
      <div class="guideItem">
        <b>${e.day} ${e.start} ${e.title}</b>
        <div class="small">${e.place} · ${blockText(e.block)} ${clash.has(e.id) ? "· Tidskrock" : ""}</div>
        ${spotifyLine}
        ${notes[e.id] ? `<div class="small">Notering: ${escapeHtml(notes[e.id])}</div>` : ""}
      </div>
    `;
  }).join("") : `<div class="empty">Du har inte valt något ännu.</div>`;

  document.querySelectorAll("[data-spotify]").forEach(btn=>{
    btn.onclick = ()=>{
      const id = Number(btn.dataset.spotify);
      const event = events.find(x=>x.id === id);
      openSpotify(event);
    };
  });
}

function makeGuideText(){
  const list = selectedEvents();

  if(!list.length){
    return "Min American Days guide är tom.";
  }

  let out = "MIN AMERICAN DAYS GUIDE\n\n";
  let lastDay = "";

  list.forEach(e=>{
    if(e.day !== lastDay){
      lastDay = e.day;
      out += e.day.toUpperCase() + "\n";
    }

    out += `${e.start}  ${e.title}  |  ${e.place}`;

    if(e.type === "music"){
      const spotify = spotifyData(e);
      out += `  |  Spotify: ${spotify.webUrl}`;
    }

    if(notes[e.id]){
      out += `  |  Notering: ${notes[e.id]}`;
    }

    out += "\n";
  });

  if(clashIds().size){
    out += "\nOBS: Det finns tidskrockar. Prioritera manuellt.\n";
  }

  return out;
}

function render(){
  renderTabs();
  renderProgram();
  renderGuide();

  document.querySelectorAll(".navbtn[data-jump]").forEach(btn=>{
    btn.classList.toggle("active",btn.dataset.jump === activeDay);
  });
}

document.querySelectorAll("[data-filter]").forEach(btn=>{
  btn.onclick = ()=>{
    activeFilter = btn.dataset.filter;

    document.querySelectorAll("[data-filter]").forEach(b=>{
      b.classList.toggle("active",b === btn);
    });

    renderProgram();
  };
});

search.oninput = renderProgram;

document.getElementById("showGuideBtn").onclick = ()=>{
  guide.classList.toggle("show");

  if(guide.classList.contains("show")){
    guide.scrollIntoView({behavior:"smooth"});
  }
};

document.getElementById("guideNav").onclick = ()=>{
  guide.classList.add("show");
  guide.scrollIntoView({behavior:"smooth"});
};

document.querySelectorAll(".navbtn[data-jump]").forEach(btn=>{
  btn.onclick = ()=>{
    activeDay = btn.dataset.jump;
    save();
    render();
    document.getElementById("section-" + activeDay).scrollIntoView({behavior:"smooth",block:"start"});
  };
});

document.getElementById("copyBtn").onclick = async ()=>{
  const text = makeGuideText();
  const box = document.getElementById("copyBox");

  box.style.display = "block";
  box.value = text;
  box.select();

  try{
    await navigator.clipboard.writeText(text);
  }catch(e){}
};

document.getElementById("clearBtn").onclick = ()=>{
  if(confirm("Rensa alla val?")){
    selected = [];
    notes = {};
    save();
    render();
  }
};

render();
</script>

</body>
</html>
